{% extends "base.html" %}

{% block title %}Login — ConnectX{% endblock %}

{% block content %}
<h1>Log in</h1>

<form class="auth-form" method="post" action="{{ url_for('auth.login') }}" novalidate>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email|default('', true) }}" required autocomplete="email" maxlength="255">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
  </div>
  <button type="submit" class="btn btn-primary">Log in</button>
</form>

<p class="form-footer">
  Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a><br>
  <a href="{{ url_for('main.index') }}">Back to home</a>
</p>
{% endblock %}
