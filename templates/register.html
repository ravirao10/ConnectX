{% extends "base.html" %}

{% block title %}Register — ConnectX{% endblock %}

{% block content %}
<h1>Create an account</h1>

<form class="auth-form" method="post" action="{{ url_for('auth.register') }}" novalidate>
  <div class="form-group">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" value="{{ username|default('', true) }}" required autocomplete="username" maxlength="80">
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email|default('', true) }}" required autocomplete="email" maxlength="255">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="new-password">
  </div>
  <div class="form-group">
    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
  </div>
  <button type="submit" class="btn btn-primary">Register</button>
</form>

<p class="form-footer">
  <a href="{{ url_for('main.index') }}">Back to home</a>
</p>
{% endblock %}
