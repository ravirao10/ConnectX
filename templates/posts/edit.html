{% extends "base.html" %}

{% block title %}Edit post — ConnectX{% endblock %}

{% block content %}
<h1>Edit post</h1>
<form class="auth-form post-form" method="post" action="{{ url_for('posts.edit', post_id=post.id) }}" novalidate>
  <div class="form-group">
    <label for="content">Content</label>
    <textarea id="content" name="content" rows="4" maxlength="1000" required>{{ content|default(post.content, true) }}</textarea>
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{{ url_for('main.feed') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
